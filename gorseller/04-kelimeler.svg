<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1312" viewBox="0 0 900 1312" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"><defs></defs><style>.c{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) forwards}.fl{transform-box:fill-box;transform-origin:center;animation:fl 3s ease-in-out infinite}.sh{animation:sh 2.6s ease-in-out infinite}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.8s ease-out infinite}@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes sh{0%,100%{opacity:1}50%{opacity:.45}}@keyframes pu{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.04,1.25)}}</style><g class="c" style="animation-delay:0.00s"><rect x="5" y="5" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="17" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:0.00s"/><text x="27" y="36.0" font-size="12" font-weight="700" fill="#f472b6">01</text><text x="57" y="37.0" font-size="16" font-weight="600" fill="#f1f5f9">Kapalı çevrim kontrol</text></g><g class="c" style="animation-delay:0.05s"><rect x="455" y="5" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="17" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:0.20s"/><text x="477" y="36.0" font-size="12" font-weight="700" fill="#f472b6">02</text><text x="507" y="37.0" font-size="16" font-weight="600" fill="#f1f5f9">Setpoint</text></g><g class="c" style="animation-delay:0.10s"><rect x="5" y="67" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="79" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:0.40s"/><text x="27" y="98.0" font-size="12" font-weight="700" fill="#f472b6">03</text><text x="57" y="99.0" font-size="16" font-weight="600" fill="#f1f5f9">Histerezis</text></g><g class="c" style="animation-delay:0.15s"><rect x="455" y="67" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="79" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:0.60s"/><text x="477" y="98.0" font-size="12" font-weight="700" fill="#f472b6">04</text><text x="507" y="99.0" font-size="16" font-weight="600" fill="#f1f5f9">Aşım</text></g><g class="c" style="animation-delay:0.20s"><rect x="5" y="129" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="141" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:0.80s"/><text x="27" y="160.0" font-size="12" font-weight="700" fill="#f472b6">05</text><text x="57" y="161.0" font-size="16" font-weight="600" fill="#f1f5f9">Interlock</text></g><g class="c" style="animation-delay:0.25s"><rect x="455" y="129" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="141" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:1.00s"/><text x="477" y="160.0" font-size="12" font-weight="700" fill="#f472b6">06</text><text x="507" y="161.0" font-size="16" font-weight="600" fill="#f1f5f9">FSM (Finite State Machine)</text></g><g class="c" style="animation-delay:0.30s"><rect x="5" y="191" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="203" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:1.20s"/><text x="27" y="222.0" font-size="12" font-weight="700" fill="#f472b6">07</text><text x="57" y="223.0" font-size="16" font-weight="600" fill="#f1f5f9">Kavramsal tasarım</text></g><g class="c" style="animation-delay:0.35s"><rect x="455" y="191" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="203" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:1.40s"/><text x="477" y="222.0" font-size="12" font-weight="700" fill="#f472b6">08</text><text x="507" y="223.0" font-size="16" font-weight="600" fill="#f1f5f9">V Modeli</text></g><g class="c" style="animation-delay:0.40s"><rect x="5" y="253" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="265" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:1.60s"/><text x="27" y="284.0" font-size="12" font-weight="700" fill="#f472b6">09</text><text x="57" y="285.0" font-size="16" font-weight="600" fill="#f1f5f9">Açık çevrim kontrol</text></g><g class="c" style="animation-delay:0.45s"><rect x="455" y="253" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="265" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:1.80s"/><text x="477" y="284.0" font-size="12" font-weight="700" fill="#f472b6">10</text><text x="507" y="285.0" font-size="16" font-weight="600" fill="#f1f5f9">PV (Process Variable)</text></g><g class="c" style="animation-delay:0.50s"><rect x="5" y="315" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="327" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:2.00s"/><text x="27" y="346.0" font-size="12" font-weight="700" fill="#f472b6">11</text><text x="57" y="347.0" font-size="16" font-weight="600" fill="#f1f5f9">MV (Manipulated Variable)</text></g><g class="c" style="animation-delay:0.55s"><rect x="455" y="315" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="327" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:2.20s"/><text x="477" y="346.0" font-size="12" font-weight="700" fill="#f472b6">12</text><text x="507" y="347.0" font-size="16" font-weight="600" fill="#f1f5f9">Hata (Error)</text></g><g class="c" style="animation-delay:0.60s"><rect x="5" y="377" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="389" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:2.40s"/><text x="27" y="408.0" font-size="12" font-weight="700" fill="#f472b6">13</text><text x="57" y="409.0" font-size="16" font-weight="600" fill="#f1f5f9">Eyleyici (Actuator)</text></g><g class="c" style="animation-delay:0.65s"><rect x="455" y="377" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="389" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:2.60s"/><text x="477" y="408.0" font-size="12" font-weight="700" fill="#f472b6">14</text><text x="507" y="409.0" font-size="16" font-weight="600" fill="#f1f5f9">Bozucu etki (Disturbance)</text></g><g class="c" style="animation-delay:0.70s"><rect x="5" y="439" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="451" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:2.80s"/><text x="27" y="470.0" font-size="12" font-weight="700" fill="#f472b6">15</text><text x="57" y="471.0" font-size="16" font-weight="600" fill="#f1f5f9">İleri besleme (Feedforward)</text></g><g class="c" style="animation-delay:0.75s"><rect x="455" y="439" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="451" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:3.00s"/><text x="477" y="470.0" font-size="12" font-weight="700" fill="#f472b6">16</text><text x="507" y="471.0" font-size="16" font-weight="600" fill="#f1f5f9">Aç-kapa kontrol (On-off / Bang-bang)</text></g><g class="c" style="animation-delay:0.80s"><rect x="5" y="501" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="513" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:3.20s"/><text x="27" y="532.0" font-size="12" font-weight="700" fill="#f472b6">17</text><text x="57" y="533.0" font-size="16" font-weight="600" fill="#f1f5f9">Zaman oranlı kontrol (Time-proportioning)</text></g><g class="c" style="animation-delay:0.85s"><rect x="455" y="501" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="513" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:3.40s"/><text x="477" y="532.0" font-size="12" font-weight="700" fill="#f472b6">18</text><text x="507" y="533.0" font-size="16" font-weight="600" fill="#f1f5f9">PID (Proportional-Integral-Derivative)</text></g><g class="c" style="animation-delay:0.90s"><rect x="5" y="563" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="575" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:3.60s"/><text x="27" y="594.0" font-size="12" font-weight="700" fill="#f472b6">19</text><text x="57" y="595.0" font-size="16" font-weight="600" fill="#f1f5f9">Kazanç (Kp - Ki - Kd)</text></g><g class="c" style="animation-delay:0.95s"><rect x="455" y="563" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="575" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:3.80s"/><text x="477" y="594.0" font-size="12" font-weight="700" fill="#f472b6">20</text><text x="507" y="595.0" font-size="16" font-weight="600" fill="#f1f5f9">Integral windup - anti-windup</text></g><g class="c" style="animation-delay:1.00s"><rect x="5" y="625" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="637" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:4.00s"/><text x="27" y="656.0" font-size="12" font-weight="700" fill="#f472b6">21</text><text x="57" y="657.0" font-size="16" font-weight="600" fill="#f1f5f9">Ölü bant (Deadband)</text></g><g class="c" style="animation-delay:1.05s"><rect x="455" y="625" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="637" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:4.20s"/><text x="477" y="656.0" font-size="12" font-weight="700" fill="#f472b6">22</text><text x="507" y="657.0" font-size="16" font-weight="600" fill="#f1f5f9">Split-range kontrol</text></g><g class="c" style="animation-delay:1.10s"><rect x="5" y="687" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="699" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:4.40s"/><text x="27" y="718.0" font-size="12" font-weight="700" fill="#f472b6">23</text><text x="57" y="719.0" font-size="16" font-weight="600" fill="#f1f5f9">Gain scheduling</text></g><g class="c" style="animation-delay:1.15s"><rect x="455" y="687" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="699" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:4.60s"/><text x="477" y="718.0" font-size="12" font-weight="700" fill="#f472b6">24</text><text x="507" y="719.0" font-size="16" font-weight="600" fill="#f1f5f9">Uyarlamalı kontrol (Adaptive control)</text></g><g class="c" style="animation-delay:1.20s"><rect x="5" y="749" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="761" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:4.80s"/><text x="27" y="780.0" font-size="12" font-weight="700" fill="#f472b6">25</text><text x="57" y="781.0" font-size="16" font-weight="600" fill="#f1f5f9">Basamak yanıtı (Step response)</text></g><g class="c" style="animation-delay:1.25s"><rect x="455" y="749" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="761" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:5.00s"/><text x="477" y="780.0" font-size="12" font-weight="700" fill="#f472b6">26</text><text x="507" y="781.0" font-size="16" font-weight="600" fill="#f1f5f9">Yükselme süresi (Rise time)</text></g><g class="c" style="animation-delay:1.30s"><rect x="5" y="811" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="823" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:5.20s"/><text x="27" y="842.0" font-size="12" font-weight="700" fill="#f472b6">27</text><text x="57" y="843.0" font-size="16" font-weight="600" fill="#f1f5f9">Oturma süresi (Settling time)</text></g><g class="c" style="animation-delay:1.35s"><rect x="455" y="811" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="823" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:5.40s"/><text x="477" y="842.0" font-size="12" font-weight="700" fill="#f472b6">28</text><text x="507" y="843.0" font-size="16" font-weight="600" fill="#f1f5f9">Kalıcı durum hatası (Steady-state error)</text></g><g class="c" style="animation-delay:1.40s"><rect x="5" y="873" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="885" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:5.60s"/><text x="27" y="904.0" font-size="12" font-weight="700" fill="#f472b6">29</text><text x="57" y="905.0" font-size="16" font-weight="600" fill="#f1f5f9">Ters aşım (Undershoot)</text></g><g class="c" style="animation-delay:1.45s"><rect x="455" y="873" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="885" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:5.80s"/><text x="477" y="904.0" font-size="12" font-weight="700" fill="#f472b6">30</text><text x="507" y="905.0" font-size="16" font-weight="600" fill="#f1f5f9">Salınım (Oscillation)</text></g><g class="c" style="animation-delay:1.50s"><rect x="5" y="935" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="947" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:6.00s"/><text x="27" y="966.0" font-size="12" font-weight="700" fill="#f472b6">31</text><text x="57" y="967.0" font-size="16" font-weight="600" fill="#f1f5f9">Sınır çevrimi (Limit cycle)</text></g><g class="c" style="animation-delay:1.55s"><rect x="455" y="935" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="947" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:6.20s"/><text x="477" y="966.0" font-size="12" font-weight="700" fill="#f472b6">32</text><text x="507" y="967.0" font-size="16" font-weight="600" fill="#f1f5f9">Hunting</text></g><g class="c" style="animation-delay:1.60s"><rect x="5" y="997" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="1009" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:6.40s"/><text x="27" y="1028.0" font-size="12" font-weight="700" fill="#f472b6">33</text><text x="57" y="1029.0" font-size="16" font-weight="600" fill="#f1f5f9">Chattering</text></g><g class="c" style="animation-delay:1.65s"><rect x="455" y="997" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="1009" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:6.60s"/><text x="477" y="1028.0" font-size="12" font-weight="700" fill="#f472b6">34</text><text x="507" y="1029.0" font-size="16" font-weight="600" fill="#f1f5f9">Doyma (Saturation)</text></g><g class="c" style="animation-delay:1.70s"><rect x="5" y="1059" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="1071" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:6.80s"/><text x="27" y="1090.0" font-size="12" font-weight="700" fill="#f472b6">35</text><text x="57" y="1091.0" font-size="16" font-weight="600" fill="#f1f5f9">Kararsızlık (Instability)</text></g><g class="c" style="animation-delay:1.75s"><rect x="455" y="1059" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="1071" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:7.00s"/><text x="477" y="1090.0" font-size="12" font-weight="700" fill="#f472b6">36</text><text x="507" y="1091.0" font-size="16" font-weight="600" fill="#f1f5f9">Ölü zaman (Dead time)</text></g><g class="c" style="animation-delay:1.80s"><rect x="5" y="1121" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="1133" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:7.20s"/><text x="27" y="1152.0" font-size="12" font-weight="700" fill="#f472b6">37</text><text x="57" y="1153.0" font-size="16" font-weight="600" fill="#f1f5f9">Zaman sabiti (τ)</text></g><g class="c" style="animation-delay:1.85s"><rect x="455" y="1121" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="1133" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:7.40s"/><text x="477" y="1152.0" font-size="12" font-weight="700" fill="#f472b6">38</text><text x="507" y="1153.0" font-size="16" font-weight="600" fill="#f1f5f9">Fail-safe</text></g><g class="c" style="animation-delay:1.90s"><rect x="5" y="1183" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="1195" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:7.60s"/><text x="27" y="1214.0" font-size="12" font-weight="700" fill="#f472b6">39</text><text x="57" y="1215.0" font-size="16" font-weight="600" fill="#f1f5f9">E-stop (Emergency stop)</text></g><g class="c" style="animation-delay:1.95s"><rect x="455" y="1183" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="1195" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:7.80s"/><text x="477" y="1214.0" font-size="12" font-weight="700" fill="#f472b6">40</text><text x="507" y="1215.0" font-size="16" font-weight="600" fill="#f1f5f9">Retry - Backoff</text></g><g class="c" style="animation-delay:2.00s"><rect x="5" y="1245" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="1257" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:8.00s"/><text x="27" y="1276.0" font-size="12" font-weight="700" fill="#f472b6">41</text><text x="57" y="1277.0" font-size="16" font-weight="600" fill="#f1f5f9">Durum izleme (Condition monitoring)</text></g><g class="c" style="animation-delay:2.05s"><rect x="455" y="1245" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="1257" width="4" height="28" rx="2" fill="#f472b6" style="animation-delay:8.20s"/><text x="477" y="1276.0" font-size="12" font-weight="700" fill="#f472b6">42</text><text x="507" y="1277.0" font-size="16" font-weight="600" fill="#f1f5f9">Kestirimci bakım (Predictive maintenance)</text></g></svg>