<svg xmlns="http://www.w3.org/2000/svg" width="900" height="940" viewBox="0 0 900 940" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"><defs></defs><style>.c{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) forwards}.fl{transform-box:fill-box;transform-origin:center;animation:fl 3s ease-in-out infinite}.sh{animation:sh 2.6s ease-in-out infinite}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.8s ease-out infinite}@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes sh{0%,100%{opacity:1}50%{opacity:.45}}@keyframes pu{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.04,1.25)}}</style><g class="c" style="animation-delay:0.00s"><rect x="5" y="5" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="17" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:0.00s"/><text x="27" y="36.0" font-size="12" font-weight="700" fill="#38bdf8">01</text><text x="57" y="37.0" font-size="16" font-weight="600" fill="#f1f5f9">GPIO (General Purpose Input/Output)</text></g><g class="c" style="animation-delay:0.05s"><rect x="455" y="5" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="17" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:0.20s"/><text x="477" y="36.0" font-size="12" font-weight="700" fill="#38bdf8">02</text><text x="507" y="37.0" font-size="16" font-weight="600" fill="#f1f5f9">MODER (Mode Register)</text></g><g class="c" style="animation-delay:0.10s"><rect x="5" y="67" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="79" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:0.40s"/><text x="27" y="98.0" font-size="12" font-weight="700" fill="#38bdf8">03</text><text x="57" y="99.0" font-size="16" font-weight="600" fill="#f1f5f9">ODR (Output Data Register)</text></g><g class="c" style="animation-delay:0.15s"><rect x="455" y="67" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="79" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:0.60s"/><text x="477" y="98.0" font-size="12" font-weight="700" fill="#38bdf8">04</text><text x="507" y="99.0" font-size="16" font-weight="600" fill="#f1f5f9">LED (Light Emitting Diode)</text></g><g class="c" style="animation-delay:0.20s"><rect x="5" y="129" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="141" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:0.80s"/><text x="27" y="160.0" font-size="12" font-weight="700" fill="#38bdf8">05</text><text x="57" y="161.0" font-size="16" font-weight="600" fill="#f1f5f9">Blink</text></g><g class="c" style="animation-delay:0.25s"><rect x="455" y="129" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="141" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:1.00s"/><text x="477" y="160.0" font-size="12" font-weight="700" fill="#38bdf8">06</text><text x="507" y="161.0" font-size="16" font-weight="600" fill="#f1f5f9">TIM (Timer)</text></g><g class="c" style="animation-delay:0.30s"><rect x="5" y="191" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="203" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:1.20s"/><text x="27" y="222.0" font-size="12" font-weight="700" fill="#38bdf8">07</text><text x="57" y="223.0" font-size="16" font-weight="600" fill="#f1f5f9">ARR (Auto-Reload Register)</text></g><g class="c" style="animation-delay:0.35s"><rect x="455" y="191" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="203" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:1.40s"/><text x="477" y="222.0" font-size="12" font-weight="700" fill="#38bdf8">08</text><text x="507" y="223.0" font-size="16" font-weight="600" fill="#f1f5f9">CCR (Capture/Compare Register)</text></g><g class="c" style="animation-delay:0.40s"><rect x="5" y="253" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="265" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:1.60s"/><text x="27" y="284.0" font-size="12" font-weight="700" fill="#38bdf8">09</text><text x="57" y="285.0" font-size="16" font-weight="600" fill="#f1f5f9">Prescaler</text></g><g class="c" style="animation-delay:0.45s"><rect x="455" y="253" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="265" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:1.80s"/><text x="477" y="284.0" font-size="12" font-weight="700" fill="#38bdf8">10</text><text x="507" y="285.0" font-size="16" font-weight="600" fill="#f1f5f9">SysTick</text></g><g class="c" style="animation-delay:0.50s"><rect x="5" y="315" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="327" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:2.00s"/><text x="27" y="346.0" font-size="12" font-weight="700" fill="#38bdf8">11</text><text x="57" y="347.0" font-size="16" font-weight="600" fill="#f1f5f9">RTC (Real-Time Clock)</text></g><g class="c" style="animation-delay:0.55s"><rect x="455" y="315" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="327" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:2.20s"/><text x="477" y="346.0" font-size="12" font-weight="700" fill="#38bdf8">12</text><text x="507" y="347.0" font-size="16" font-weight="600" fill="#f1f5f9">Interrupt</text></g><g class="c" style="animation-delay:0.60s"><rect x="5" y="377" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="389" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:2.40s"/><text x="27" y="408.0" font-size="12" font-weight="700" fill="#38bdf8">13</text><text x="57" y="409.0" font-size="16" font-weight="600" fill="#f1f5f9">EXTI (External Interrupt)</text></g><g class="c" style="animation-delay:0.65s"><rect x="455" y="377" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="389" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:2.60s"/><text x="477" y="408.0" font-size="12" font-weight="700" fill="#38bdf8">14</text><text x="507" y="409.0" font-size="16" font-weight="600" fill="#f1f5f9">ISR (Interrupt Service Routine)</text></g><g class="c" style="animation-delay:0.70s"><rect x="5" y="439" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="451" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:2.80s"/><text x="27" y="470.0" font-size="12" font-weight="700" fill="#38bdf8">15</text><text x="57" y="471.0" font-size="16" font-weight="600" fill="#f1f5f9">NVIC (Nested Vectored Interrupt Controller)</text></g><g class="c" style="animation-delay:0.75s"><rect x="455" y="439" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="451" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:3.00s"/><text x="477" y="470.0" font-size="12" font-weight="700" fill="#38bdf8">16</text><text x="507" y="471.0" font-size="16" font-weight="600" fill="#f1f5f9">Watchdog</text></g><g class="c" style="animation-delay:0.80s"><rect x="5" y="501" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="513" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:3.20s"/><text x="27" y="532.0" font-size="12" font-weight="700" fill="#38bdf8">17</text><text x="57" y="533.0" font-size="16" font-weight="600" fill="#f1f5f9">IWDG (Independent Watchdog)</text></g><g class="c" style="animation-delay:0.85s"><rect x="455" y="501" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="513" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:3.40s"/><text x="477" y="532.0" font-size="12" font-weight="700" fill="#38bdf8">18</text><text x="507" y="533.0" font-size="16" font-weight="600" fill="#f1f5f9">Polling</text></g><g class="c" style="animation-delay:0.90s"><rect x="5" y="563" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="575" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:3.60s"/><text x="27" y="594.0" font-size="12" font-weight="700" fill="#38bdf8">19</text><text x="57" y="595.0" font-size="16" font-weight="600" fill="#f1f5f9">Push-Pull</text></g><g class="c" style="animation-delay:0.95s"><rect x="455" y="563" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="575" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:3.80s"/><text x="477" y="594.0" font-size="12" font-weight="700" fill="#38bdf8">20</text><text x="507" y="595.0" font-size="16" font-weight="600" fill="#f1f5f9">Open Drain</text></g><g class="c" style="animation-delay:1.00s"><rect x="5" y="625" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="637" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:4.00s"/><text x="27" y="656.0" font-size="12" font-weight="700" fill="#38bdf8">21</text><text x="57" y="657.0" font-size="16" font-weight="600" fill="#f1f5f9">IDR (Input Data Register)</text></g><g class="c" style="animation-delay:1.05s"><rect x="455" y="625" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="637" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:4.20s"/><text x="477" y="656.0" font-size="12" font-weight="700" fill="#38bdf8">22</text><text x="507" y="657.0" font-size="16" font-weight="600" fill="#f1f5f9">BSRR (Bit Set/Reset Register)</text></g><g class="c" style="animation-delay:1.10s"><rect x="5" y="687" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="699" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:4.40s"/><text x="27" y="718.0" font-size="12" font-weight="700" fill="#38bdf8">23</text><text x="57" y="719.0" font-size="16" font-weight="600" fill="#f1f5f9">Floating</text></g><g class="c" style="animation-delay:1.15s"><rect x="455" y="687" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="699" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:4.60s"/><text x="477" y="718.0" font-size="12" font-weight="700" fill="#38bdf8">24</text><text x="507" y="719.0" font-size="16" font-weight="600" fill="#f1f5f9">Wired-AND</text></g><g class="c" style="animation-delay:1.20s"><rect x="5" y="749" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="761" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:4.80s"/><text x="27" y="780.0" font-size="12" font-weight="700" fill="#38bdf8">25</text><text x="57" y="781.0" font-size="16" font-weight="600" fill="#f1f5f9">Alternate Function</text></g><g class="c" style="animation-delay:1.25s"><rect x="455" y="749" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="761" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:5.00s"/><text x="477" y="780.0" font-size="12" font-weight="700" fill="#38bdf8">26</text><text x="507" y="781.0" font-size="16" font-weight="600" fill="#f1f5f9">AFIO (Alternate Function I/O)</text></g><g class="c" style="animation-delay:1.30s"><rect x="5" y="811" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="823" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:5.20s"/><text x="27" y="842.0" font-size="12" font-weight="700" fill="#38bdf8">27</text><text x="57" y="843.0" font-size="16" font-weight="600" fill="#f1f5f9">CRL - CRH (Configuration Register Low / High)</text></g><g class="c" style="animation-delay:1.35s"><rect x="455" y="811" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="823" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:5.40s"/><text x="477" y="842.0" font-size="12" font-weight="700" fill="#38bdf8">28</text><text x="507" y="843.0" font-size="16" font-weight="600" fill="#f1f5f9">WWDG (Window Watchdog)</text></g><g class="c" style="animation-delay:1.40s"><rect x="5" y="873" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="5" y="885" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:5.60s"/><text x="27" y="904.0" font-size="12" font-weight="700" fill="#38bdf8">29</text><text x="57" y="905.0" font-size="16" font-weight="600" fill="#f1f5f9">PWR (Power Control)</text></g><g class="c" style="animation-delay:1.45s"><rect x="455" y="873" width="440" height="52" rx="14" fill="#111827" stroke="#334155" stroke-width="1"/><rect class="sh" x="455" y="885" width="4" height="28" rx="2" fill="#38bdf8" style="animation-delay:5.80s"/><text x="477" y="904.0" font-size="12" font-weight="700" fill="#38bdf8">30</text><text x="507" y="905.0" font-size="16" font-weight="600" fill="#f1f5f9">Bit-banding</text></g></svg>